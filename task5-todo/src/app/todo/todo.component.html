<div class="todo">
  <h2>Список дел</h2>

  <div *ngFor="let task of tasks; let i = index" class="task">
    <input type="checkbox" [(ngModel)]="task.done">

    <span [ngClass]="{'done': task.done}">{{ task.text }}</span>

    <img [src]="task.image" alt="фото" width="60">

    <button (click)="removeTask(i)">🗑</button>
  </div>

  <div class="form">
    <input
      type="text"
      placeholder="Например, новая задача"
      [(ngModel)]="newTask">

    <select [(ngModel)]="newImage">
      <option *ngFor="let img of images" [value]="img">{{ img }}</option>
    </select>

    <button (click)="addTask()">Добавить</button>
  </div>
</div>
